<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="칭찬일기">
<meta name="description" content="초등학생을 위한 칭찬일기 — 알아차리기, 돌아보고 소중히 여기기, 감사 연습하기">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 34V18' stroke='%232F8F60' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M20 22c-9 0-12-6-12-11 6-1 12 2 12 11z' fill='%232F8F60'/%3E%3Cpath d='M20 26c8 0 11-5 11-10-5-1-11 2-11 10z' fill='%232E7DD1'/%3E%3C/svg%3E">
<title>칭찬일기 새싹노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap">
<style>
:root{
  --paper:#EEF4FA; --card:#FFFFFF; --card-2:#F7FAFD;
  --ink:#17232F; --ink-soft:#57697C; --ink-faint:#8496A6;
  --line:#DBE6EF; --line-strong:#C3D4E3;
  --sky:#2E7DD1; --sky-soft:#DCEBFA; --sky-ink:#1B4E85;
  --sun:#D9821B; --sun-soft:#FCEDD7; --sun-ink:#8E5309;
  --night:#4453A0; --night-soft:#E2E5F7; --night-ink:#2E397A;
  --leaf:#2F8F60; --leaf-soft:#DCF0E5; --leaf-ink:#1F6844;
  --shadow:0 2px 0 rgba(23,35,47,.05), 0 10px 24px -14px rgba(23,35,47,.35);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161E; --card:#1A2430; --card-2:#212D3B;
    --ink:#E9EFF5; --ink-soft:#A2B3C3; --ink-faint:#7B8D9D;
    --line:#2C3948; --line-strong:#3A4A5C;
    --sky:#79B8F5; --sky-soft:#17293C; --sky-ink:#A9D2F9;
    --sun:#F0B45E; --sun-soft:#33280F; --sun-ink:#F4C88A;
    --night:#9AA6EE; --night-soft:#232945; --night-ink:#BAC3F5;
    --leaf:#6FCB97; --leaf-soft:#16301F; --leaf-ink:#95DDB5;
    --shadow:0 2px 0 rgba(0,0,0,.2), 0 12px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161E; --card:#1A2430; --card-2:#212D3B;
  --ink:#E9EFF5; --ink-soft:#A2B3C3; --ink-faint:#7B8D9D;
  --line:#2C3948; --line-strong:#3A4A5C;
  --sky:#79B8F5; --sky-soft:#17293C; --sky-ink:#A9D2F9;
  --sun:#F0B45E; --sun-soft:#33280F; --sun-ink:#F4C88A;
  --night:#9AA6EE; --night-soft:#232945; --night-ink:#BAC3F5;
  --leaf:#6FCB97; --leaf-soft:#16301F; --leaf-ink:#95DDB5;
  --shadow:0 2px 0 rgba(0,0,0,.2), 0 12px 28px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:18px; line-height:1.7; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:"Jua","Gowun Dodum",sans-serif; font-weight:400; text-wrap:balance; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf); outline-offset:2px; border-radius:6px}
.hidden{display:none !important}

.topbar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0}
.brand h1{font-size:21px; margin:0; white-space:nowrap}
.brand .sub{font-size:13px; color:var(--ink-faint); white-space:nowrap; display:flex; align-items:center; gap:6px}
.sync{display:inline-flex; align-items:center; gap:4px; padding:1px 8px; border-radius:999px; font-size:12px}
.sync.on{background:var(--leaf-soft); color:var(--leaf-ink)}
.sync.off{background:var(--card-2); color:var(--ink-faint)}
.whoami{display:flex; align-items:center; gap:8px; background:var(--leaf-soft); color:var(--leaf-ink);
  border:1px solid transparent; border-radius:999px; padding:8px 14px; font-size:15px; min-height:44px; max-width:230px}
.whoami b{font-family:"Jua",sans-serif; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.icon-btn{background:var(--card-2); border:1px solid var(--line); border-radius:999px;
  min-width:44px; min-height:44px; display:grid; place-items:center; font-size:17px}
.icon-btn:hover{border-color:var(--line-strong)}

.tabs{background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; -webkit-overflow-scrolling:touch}
.tabs-in{max-width:1080px; margin:0 auto; padding:0 12px 10px; display:flex; gap:8px}
.tab{flex:0 0 auto; background:transparent; border:1px solid var(--line); border-radius:999px;
  padding:10px 18px; min-height:48px; color:var(--ink-soft); font-size:16px; white-space:nowrap;
  display:flex; align-items:center; gap:7px}
.tab[aria-selected="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}

main{max-width:1080px; margin:0 auto; padding:20px 16px 80px}
.stack{display:flex; flex-direction:column; gap:18px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.page-head h2{font-size:26px; margin:0 0 4px}
.page-head p{margin:0; color:var(--ink-soft); font-size:16px}
.sheet{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden}
.sheet-body{padding:22px}
@media (max-width:520px){ .sheet-body{padding:16px} }

.hello{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.hello .txt{flex:1 1 240px; min-width:0}
.hello h2{margin:0 0 4px; font-size:29px}
.hello p{margin:0; color:var(--ink-soft)}
.stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; flex:1 1 100%}
.stat{flex:1 1 130px; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px}
.stat .n{font-family:"Jua",sans-serif; font-size:25px; line-height:1.2; font-variant-numeric:tabular-nums}
.stat .l{font-size:14px; color:var(--ink-soft)}

/* 진행 단계 */
.road{display:flex; flex-direction:column; gap:12px}
.step{display:flex; gap:0; border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; background:var(--card)}
.step .rail{flex:0 0 12px}
.step .in{flex:1 1 auto; padding:16px 20px; min-width:0}
.step .eyebrow{font-size:13px; letter-spacing:.14em; font-weight:700}
.step h3{margin:2px 0 4px; font-size:22px}
.step .sub{margin:0; color:var(--ink-soft); font-size:15px}
.step.now{box-shadow:var(--shadow)}
.step.locked{opacity:.55}
.step.done .in{background:var(--card-2)}
.lv1 .rail{background:var(--sky)} .lv1 .eyebrow{color:var(--sky)}
.lv2 .rail{background:var(--sun)} .lv2 .eyebrow{color:var(--sun)}
.lv3 .rail{background:var(--night)} .lv3 .eyebrow{color:var(--night)}
.dots{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.dots i{width:16px; height:16px; border-radius:50%; border:2px solid var(--line-strong); display:block}
.lv1 .dots i.f{background:var(--sky); border-color:var(--sky)}
.lv2 .dots i.f{background:var(--sun); border-color:var(--sun)}
.lv3 .dots i.f{background:var(--night); border-color:var(--night)}
.meter{margin-top:10px; height:14px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); overflow:hidden}
.meter span{display:block; height:100%; border-radius:999px}
.lv3 .meter span{background:var(--night)}
.count{font-family:"Jua",sans-serif; font-variant-numeric:tabular-nums; margin-top:8px; font-size:15px; color:var(--ink-soft)}
.badge-done{display:inline-block; background:var(--leaf-soft); color:var(--leaf-ink); border-radius:999px; padding:2px 12px; font-size:14px}

.entry-head{padding:20px 22px; display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap}
.entry-head .t{flex:1 1 220px}
.entry-head .eyebrow{font-size:13px; letter-spacing:.14em; font-weight:700}
.entry-head h2{margin:2px 0 0; font-size:25px}
.datefield{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--ink-soft)}
.datefield input{background:var(--card); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 12px; min-height:44px}
.lv1 .entry-head{background:var(--sky-soft)} .lv1 .entry-head .eyebrow{color:var(--sky-ink)} .lv1 .entry-head h2{color:var(--sky-ink)}
.lv2 .entry-head{background:var(--sun-soft)} .lv2 .entry-head .eyebrow{color:var(--sun-ink)} .lv2 .entry-head h2{color:var(--sun-ink)}
.lv3 .entry-head{background:var(--night-soft)} .lv3 .entry-head .eyebrow{color:var(--night-ink)} .lv3 .entry-head h2{color:var(--night-ink)}

.notice{margin:0; padding:12px 16px; border-radius:var(--r-md); background:var(--sun-soft); color:var(--sun-ink); font-size:15px}
.q{padding:22px; border-top:1px solid var(--line)}
.q h3{margin:0; font-size:20px; padding-bottom:8px; border-bottom:2px solid var(--line-strong)}
.q .hint{margin:8px 0 14px; color:var(--ink-soft); font-size:15px}
.lines{display:flex; flex-direction:column; gap:10px}
.line{display:flex; gap:10px; align-items:flex-start}
.line .bullet{flex:0 0 auto; width:22px; text-align:center; color:var(--ink-faint); padding-top:12px}
.line textarea{flex:1 1 auto; min-height:52px; resize:none; overflow:hidden;
  background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; line-height:1.6}
.line textarea::placeholder{color:var(--ink-faint)}
.line textarea:focus{background:var(--card); border-color:var(--leaf)}
.line .del{flex:0 0 auto; background:transparent; border:none; color:var(--ink-faint); min-width:40px; min-height:44px; border-radius:var(--r-sm); font-size:20px}
.line .del:hover{color:var(--ink); background:var(--card-2)}
.addline{margin-top:12px; background:transparent; border:1.5px dashed var(--line-strong); color:var(--ink-soft);
  border-radius:var(--r-md); padding:10px 16px; min-height:48px; width:100%}
.addline:hover{border-color:var(--leaf); color:var(--leaf-ink)}
.example{margin-top:14px}
.example > summary{list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  background:var(--card-2); border:1px solid var(--line); border-radius:999px; padding:9px 16px; min-height:44px; font-size:15px; color:var(--ink-soft)}
.example > summary::-webkit-details-marker{display:none}
.example[open] > summary{background:var(--leaf-soft); color:var(--leaf-ink); border-color:transparent}
.example .ex-body{margin-top:12px; padding:14px 16px; border-radius:var(--r-md); background:var(--card-2); border:1px dashed var(--line-strong)}
.example .ex-body p{font-family:"Gaegu","Gowun Dodum",cursive; font-size:22px; line-height:1.5; margin:0 0 6px; color:var(--ink-soft)}
.example .ex-body p:last-child{margin-bottom:0}
.savebar{padding:18px 22px; border-top:1px solid var(--line); background:var(--card-2); display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.btn{border:1px solid transparent; border-radius:999px; padding:12px 24px; min-height:52px;
  font-family:"Jua",sans-serif; font-size:18px; display:inline-flex; align-items:center; gap:8px;
  text-decoration:none; cursor:pointer}
.btn-main{background:var(--leaf); color:#fff}
.btn-main:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--ink-faint); color:var(--ink)}
.savebar .note{color:var(--ink-faint); font-size:14px; margin-left:auto}

.break-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.break-card{text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px}
.break-card:hover{border-color:var(--line-strong)}
.break-card .eyebrow{font-size:12px; letter-spacing:.14em; color:var(--leaf); font-weight:700}
.break-card h3{margin:0; font-size:20px}
.break-card p{margin:0; color:var(--ink-soft); font-size:15px}
.break-card .done{margin-top:6px; font-size:14px; color:var(--leaf-ink)}
.sci details{border-top:1px solid var(--line)}
.sci details:first-child{border-top:none}
.sci summary{list-style:none; cursor:pointer; padding:16px 4px; display:flex; align-items:center; gap:12px; min-height:56px; font-family:"Jua",sans-serif; font-size:18px}
.sci summary::-webkit-details-marker{display:none}
.sci summary .mark{color:var(--sky); font-size:15px}
.sci .sci-body{padding:0 4px 18px}
.sci .sci-body p{margin:0 0 10px; color:var(--ink-soft)}
.sci .src{font-size:13px; color:var(--ink-faint)}

.record{border:1px solid var(--line); border-radius:var(--r-lg); background:var(--card); overflow:hidden}
.record > summary{list-style:none; cursor:pointer; padding:16px 18px; display:flex; align-items:center; gap:12px; min-height:60px; flex-wrap:wrap}
.record > summary::-webkit-details-marker{display:none}
.chip{flex:0 0 auto; font-size:13px; padding:5px 12px; border-radius:999px; font-family:"Jua",sans-serif}
.chip-1{background:var(--sky-soft); color:var(--sky-ink)}
.chip-2{background:var(--sun-soft); color:var(--sun-ink)}
.chip-3{background:var(--night-soft); color:var(--night-ink)}
.chip-b{background:var(--leaf-soft); color:var(--leaf-ink)}
.rdate{font-family:"Jua",sans-serif; font-size:17px; font-variant-numeric:tabular-nums}
.rprev{color:var(--ink-faint); font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 120px; min-width:0}
.rbody{padding:0 18px 18px; border-top:1px solid var(--line)}
.rq{margin-top:16px}
.rq h4{margin:0 0 6px; font-size:16px; color:var(--ink-soft)}
.rq ul{margin:0; padding-left:20px}
.rq li{margin-bottom:4px}
.ractions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap}
.mini{border:1px solid var(--line-strong); background:transparent; color:var(--ink-soft);
  border-radius:999px; padding:8px 16px; min-height:44px; font-size:15px}
.mini:hover{color:var(--ink); border-color:var(--ink-faint)}
.mini.danger:hover{color:#c0392b; border-color:#c0392b}
.mini.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

.fav-add{display:flex; gap:10px; flex-wrap:wrap}
.fav-add input{flex:1 1 220px; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; min-height:52px}
.fav-add input:focus{background:var(--card); border-color:var(--leaf)}
.fav-list{list-style:none; margin:18px 0 0; padding:0}
.fav-list li{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line)}
.fav-list li:last-child{border-bottom:none}
.fav-list .dot{flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--sun)}
.fav-list .txt{flex:1 1 auto; min-width:0}
.empty{color:var(--ink-faint); text-align:center; padding:30px 10px}

/* 완료 */
.finale{text-align:center; padding:40px 24px}
.finale h2{font-size:32px; margin:14px 0 8px}
.finale p{margin:0 auto 8px; max-width:34em; color:var(--ink-soft)}

/* 교사 화면 */
.tsheet{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto}
table.data{width:100%; border-collapse:collapse; font-size:16px; min-width:640px}
table.data th, table.data td{padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle}
table.data th{font-family:"Jua",sans-serif; font-weight:400; color:var(--ink-soft); font-size:15px; white-space:nowrap;
  position:sticky; top:0; background:var(--card)}
table.data td.num, table.data th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
table.data tbody tr:hover{background:var(--card-2)}
table.data .namebtn{background:none; border:none; padding:0; font-family:"Jua",sans-serif; font-size:17px; color:var(--ink); text-align:left}
table.data .namebtn:hover{text-decoration:underline}
.progcell{display:flex; align-items:center; gap:8px; min-width:120px}
.progcell .bar{flex:1 1 60px; height:8px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); overflow:hidden}
.progcell .bar span{display:block; height:100%}

.chart{margin-top:8px}
.bars{display:flex; align-items:flex-end; gap:2px; height:150px; padding-top:8px}
.bars .b{flex:1 1 auto; position:relative; display:flex; flex-direction:column; justify-content:flex-end; height:100%; min-width:14px}
.bars .b i{display:block; width:100%; background:var(--sky); border-radius:4px 4px 0 0; min-height:2px}
.bars .b.zero i{background:var(--line-strong)}
.bars .b:hover .tip{display:block}
.tip{display:none; position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:5px 10px; border-radius:8px; font-size:13px; white-space:nowrap; z-index:5}
.xaxis{display:flex; gap:2px; border-top:1px solid var(--line); padding-top:6px}
.xaxis span{flex:1 1 auto; min-width:14px; text-align:center; font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  overflow:hidden; white-space:nowrap}
.wordlist{display:flex; flex-direction:column; gap:8px}
.wordrow{display:flex; align-items:center; gap:10px}
.wordrow .w{flex:0 0 110px; text-align:right; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wordrow .bar{flex:1 1 auto; height:16px; background:var(--card-2); border-radius:4px; overflow:hidden}
.wordrow .bar i{display:block; height:100%; background:var(--leaf); border-radius:0 4px 4px 0}
.wordrow .c{flex:0 0 44px; text-align:right; font-variant-numeric:tabular-nums; font-size:14px; color:var(--ink-soft)}

.gate{position:fixed; inset:0; background:var(--paper); z-index:50; display:grid; place-items:center; padding:20px; overflow:auto}
.gate .box{max-width:470px; width:100%; text-align:center; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:32px 26px; box-shadow:var(--shadow)}
.gate h2{margin:14px 0 6px; font-size:25px}
.gate p{margin:0 0 18px; color:var(--ink-soft); font-size:16px}
.gate input{width:100%; text-align:center; background:var(--card-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:14px; min-height:56px; font-size:20px; font-family:"Jua",sans-serif}
.gate input:focus{background:var(--card); border-color:var(--leaf)}
.gate .btn{margin-top:14px; width:100%; justify-content:center}
.gate .alt{margin-top:14px; background:none; border:none; color:var(--ink-faint); font-size:15px; text-decoration:underline}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(150%);
  background:var(--ink); color:var(--paper); padding:14px 24px; border-radius:999px;
  font-family:"Jua",sans-serif; font-size:17px; z-index:60; transition:transform .28s ease; box-shadow:var(--shadow); max-width:90vw; text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

footer{max-width:1080px; margin:0 auto; padding:0 16px 40px; color:var(--ink-faint); font-size:13px}
@media print{
  .topbar,.tabs,.savebar,.ractions,.no-print,footer{display:none !important}
  body{background:#fff; color:#000; font-size:12pt}
  .sheet,.record,.tsheet{border:none; box-shadow:none}
  .rbody{display:block !important}
}
</style>
<style>
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 34V18" stroke="var(--leaf)" stroke-width="3" stroke-linecap="round"/>
        <path d="M20 22c-9 0-12-6-12-11 6-1 12 2 12 11z" fill="var(--leaf)"/>
        <path d="M20 26c8 0 11-5 11-10-5-1-11 2-11 10z" fill="var(--sky)"/>
      </svg>

}
function nameOf(key){
  try{
    const h=key.slice(1); const m=h.match(/../g)||[];
    return new TextDecoder().decode(new Uint8Array(m.map(x=>parseInt(x,16))));
  }catch(e){ return key; }
}

function teacherLogout(){
  TEACHER={token:"",refresh:"",email:""}; LS.set("ss.teacher",TEACHER);
  ALL=[]; stopPoll(); MODE="student"; renderTabs(); render();

async function fetchAll(retried){
  if(!TEACHER.token) return false;
  try{
    const r = await fetch(SB.url+"/rest/v1/diary?select=*&order=created_at.asc&limit=20000",
      { headers:{ apikey:SB.key, Authorization:"Bearer "+TEACHER.token } });
    if(r.status===401 && !retried){ if(await teacherRenew()) return fetchAll(true); return false; }
    if(!r.ok) return false;
    ALL = buildAll(await r.json());
    return true;
  }catch(e){ return false; }
}
function buildAll(rows){
  const m=new Map();
  (rows||[]).forEach(r=>{
    const name=(r.student||"").trim() || "(이름 없음)";
    if(!m.has(name)) m.set(name,{key:name, name, entries:{}, breaks:{}, favorites:[], updatedAt:""});
    const s=m.get(name);
    const c=r.content||{};
    if(r.kind==="entry"){
      s.entries[r.slot]={ level:r.level, date:r.entry_date, answers:c.answers||{}, savedAt:r.created_at };
    } else if(r.kind==="break"){
      s.breaks[r.slot]={ text:c.text||"", date:r.entry_date, title:c.title||"", prompt:c.prompt||"" };
    } else if(r.kind==="favorite"){
      s.favorites=s.favorites.filter(f=>f.id!==r.slot);
      s.favorites.unshift({ id:r.slot, text:c.text||"", date:r.entry_date });
    }
    s.updatedAt=r.created_at||s.updatedAt;
  });
  return Array.from(m.values());
}
function localAll(){
  return LS.keys().filter(k=>k.startsWith("ss.data.")).map(k=>{
    const v=LS.get(k,{})||{}; const key=k.slice(8);
    return {key, name:v.name||nameOf(key), entries:v.entries||{}, breaks:v.breaks||{}, favorites:v.favorites||[], updatedAt:v.updatedAt||""};
  }).filter(s=>Object.keys(s.entries).length || Object.keys(s.breaks).length);
}

/* 진행 상황 */
function progressOf(entries){
  const p={1:new Set(),2:new Set(),3:new Set()};
  Object.values(entries||{}).forEach(e=>{ if(p[e.level]) p[e.level].add(e.date); });
  return {1:p[1].size, 2:p[2].size, 3:p[3].size};
}
function stageIndexOf(prog){
  for(let i=0;i<STAGES.length;i++){ if(prog[STAGES[i].level] < STAGES[i].need) return i; }
  return STAGES.length; // 모두 완료
}

function stepCard(i, prog, idx){
  const st=STAGES[i], L=LEVELS.find(l=>l.n===st.level);
  const cnt=Math.min(prog[st.level], st.need), done=prog[st.level]>=st.need, now=(i===idx);
  const c=el("div","step "+L.key+(now?" now":done?" done":" locked"));
  const bar = st.need>20
    ? `<div class="meter"><span style="width:${Math.round(cnt/st.need*100)}%"></span></div>`
    : `<div class="dots">${Array.from({length:st.need},(_,k)=>`<i class="${k<cnt?"f":""}"></i>`).join("")}</div>`;
  c.innerHTML = `<span class="rail"></span><span class="in">
      <span class="eyebrow">LEVEL ${st.level} · ${st.need}일</span>
      <h3>${L.title} ${done?'<span class="badge-done">다 했어요</span>':now?"":"🔒"}</h3>
      <p class="sub">${done? "이 단계를 마쳤어요." : now? "지금 쓰고 있는 단계예요." : `앞 단계를 마치면 열려요.`}</p>
      ${bar}<div class="count">${cnt} / ${st.need}일</div></span>`;
  return c;
}

function makeLine(ph, val){
  const line=el("div","line");
  line.appendChild(el("span","bullet","•"));
  const ta=el("textarea"); ta.rows=1; ta.placeholder=ph||""; ta.value=val||"";
  ta.addEventListener("input",()=>autogrow(ta));

  del.onclick=()=>{ const p=line.parentNode; if(p.children.length>1) line.remove(); else { ta.value=""; autogrow(ta); } };

async function saveEntry(L, form){
  const date = form.querySelector('input[name="date"]').value || todayISO();
  if(date>todayISO()){ toast("아직 오지 않은 날에는 쓸 수 없어요."); return; }
  const answers={}; let any=false;
  L.questions.forEach(q=>{
    const box=form.querySelector(`[data-q="${q.id}"]`);
    const vals=[...box.querySelectorAll("textarea")].map(t=>t.value.trim()).filter(Boolean);
    answers[q.id]=vals; if(vals.length) any=true;
  });
  if(!any){ toast("한 줄이라도 써 보고 저장해요!"); return; }
  const key=eKey(date,L.n);
  const wasNew=!DATA.entries[key];
  const entry={ level:L.n, date, answers, savedAt:new Date().toISOString() };
  DATA.entries = Object.assign({}, DATA.entries, {[key]:entry});
  saveLocal();
  await sendRow("entry", key, date, L.n, { answers });

  const prog=progressOf(DATA.entries), idx=stageIndexOf(prog);
  const st=STAGES.find(s=>s.level===L.n);
  if(wasNew && st && prog[L.n]===st.need){
    const nextL = LEVELS.find(l=>l.n===L.n+1);
    toast(nextL? `${LEVELS.find(l=>l.n===L.n).title} ${st.need}일 완성! 이제 ‘${nextL.title}’로 넘어가요 🎉` : "감사일기 100일을 모두 마쳤어요! 🎉");
    go("home");
    return;
  }
  toast(wasNew? "잘했어요! 일기를 저장했어요 🌱" : "고쳐 쓴 내용을 저장했어요.");
  go("log",{justSaved:key});
}

function teacherByDate(list){
  const wrap=el("div","stack");
  const head=el("div","page-head");
  head.innerHTML=`<h2>일자별 보기</h2><p>하루 동안 학생들이 쓴 일기를 한자리에서 볼 수 있어요.</p>`;
  wrap.appendChild(head);
  wrap.appendChild(teacherTools(list));

  /* 최근 14일 작성 학생 수 */
  const days=[]; for(let i=13;i>=0;i--) days.push(shiftDate(todayISO(),-i));
  const counts=days.map(d=> list.filter(s=>Object.values(s.entries).some(e=>e.date===d)).length );
  const peak=Math.max(1,...counts);
  const max=Math.max(peak, list.length||1);   // 학급 인원을 기준으로 눈금을 잡아요
  const chartSheet=el("div","tsheet"); const cb=el("div","sheet-body");
  cb.appendChild(el("h3",null,"최근 2주 동안 일기를 쓴 학생 수")).style.cssText="margin:0 0 2px;font-size:19px";
  const sub=el("p",null,`세로 눈금은 학급 전체 ${max}명 기준 · 가장 많았던 날 ${peak}명`); sub.style.cssText="margin:0;color:var(--ink-soft);font-size:15px";
  cb.appendChild(sub);
  const chart=el("div","chart");
  const bars=el("div","bars");
  days.forEach((d,i)=>{
    const b=el("div","b"+(counts[i]===0?" zero":""));
    const tip=el("span","tip",`${d} · ${counts[i]}명`);
    const bar=el("i"); bar.style.height=Math.max(2, Math.round(counts[i]/max*130))+"px";
    b.appendChild(tip); b.appendChild(bar);
    b.title=`${d} · ${counts[i]}명`;
    bars.appendChild(b);
  });
  const ax=el("div","xaxis");
  days.forEach(d=> ax.appendChild(el("span",null,d.slice(5).replace("-","/"))) );
  chart.appendChild(bars); chart.appendChild(ax); cb.appendChild(chart);
  chartSheet.appendChild(cb); wrap.appendChild(chartSheet);

  /* 날짜 선택 */
  const pick=el("div","row");
  const lab=el("label","datefield"); lab.innerHTML="<span>날짜 고르기</span>";
  const di=el("input"); di.type="date"; di.value=current.tdate; di.max=todayISO();
  di.onchange=()=>{ current.tdate=di.value; render(); };
  lab.appendChild(di); pick.appendChild(lab);
  const prev=el("button","mini","← 앞날"); prev.onclick=()=>{ current.tdate=shiftDate(current.tdate,-1); render(); };
  const next=el("button","mini","다음날 →"); next.onclick=()=>{ if(current.tdate<todayISO()){ current.tdate=shiftDate(current.tdate,1); render(); } };
  pick.appendChild(prev); pick.appendChild(next);
  wrap.appendChild(pick);

  const day=current.tdate;
  const wrote=list.map(s=>({ s, es:Object.values(s.entries).filter(e=>e.date===day) })).filter(x=>x.es.length);
  const h=el("div","page-head");
  h.innerHTML=`<h2 style="font-size:21px">${krDate(day)}</h2><p>${wrote.length}명이 썼어요 · 안 쓴 학생 ${list.length-wrote.length}명</p>`;
  wrap.appendChild(h);

  if(!wrote.length){ wrap.appendChild(el("p","empty","이 날에는 저장된 일기가 없어요.")); }
  wrote.forEach(({s,es})=>{
    es.forEach(e=>{
      const d=el("details","record"); d.open=true;
      const L=LEVELS.find(l=>l.n===e.level);
      const sm=el("summary");
      sm.innerHTML=`<span class="chip chip-${e.level}">${e.level}단계</span><span class="rdate">${escapeHtml(s.name)}</span><span class="rprev">${L.title}</span>`;
      d.appendChild(sm);
      const body=el("div","rbody"); body.appendChild(renderEntryBody({kind:"entry",data:e})); d.appendChild(body);
      wrap.appendChild(d);
    });
  });
  if(list.length-wrote.length>0){
    const miss=list.filter(s=>!wrote.some(w=>w.s.key===s.key)).map(s=>s.name).join(", ");
    const box=el("div","tsheet"); const b=el("div","sheet-body");
    b.appendChild(el("h3",null,"이 날 쓰지 않은 학생")).style.cssText="margin:0 0 6px;font-size:18px";
    b.appendChild(el("p",null,miss)).style.cssText="margin:0;color:var(--ink-soft)";
    box.appendChild(b); wrap.appendChild(box);
  }
  return wrap;
}

const STOP = new Set(["오늘","정말","조금","다시","그리고","하지만","우리","내가","나는","너무","같이","진짜","그냥","가장","제일","때문","하는","해서","있는","있어","싶다","좋다","좋았","고마","것이","것을","이다","했다","한다","싶어","보고","보다","에게","에서"]);
const JOSA = ["으로부터","에게서","께서","에서","으로","이랑","에게","한테","부터","까지","보다","라고","이나","에는","에도","와의","과의","을","를","이","가","은","는","의","에","와","과","도","만","랑","로"];
function tokens(text){
  return String(text).split(/[^0-9A-Za-z가-힣]+/).filter(Boolean).map(w=>{
    for(const j of JOSA){ if(w.length>j.length+1 && w.endsWith(j)) return w.slice(0,-j.length); }
    return w;
  }).filter(w=> w.length>=2 && !STOP.has(w) && !/^\d+$/.test(w));
}
function teacherWords(list){
  const wrap=el("div","stack");
  const head=el("div","page-head");
  head.innerHTML=`<h2>낱말 분석</h2><p>학생들이 일기에 자주 쓴 낱말이에요. 자동으로 세는 것이라 조사가 남거나 어색한 낱말이 섞일 수 있어요.</p>`;
  wrap.appendChild(head);
  wrap.appendChild(teacherTools(list));

  const count={}; let n=0;
  list.forEach(s=>Object.values(s.entries).forEach(e=>{
    Object.values(e.answers||{}).forEach(arr=>arr.forEach(t=>{ n++; tokens(t).forEach(w=>count[w]=(count[w]||0)+1); }));
  }));
  const top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,20);

  const byLevel=[1,2,3].map(l=> list.reduce((m,s)=> m+Object.values(s.entries).filter(e=>e.level===l).length,0));
  const stats=el("div","stats"); stats.style.margin="0";
  [[n,"문장 수"],[Object.keys(count).length,"낱말 종류"],[byLevel[0],"1단계 일기"],[byLevel[1],"2단계 일기"],[byLevel[2],"3단계 일기"]]
    .forEach(([v,l])=>{ const s=el("div","stat"); s.innerHTML=`<div class="n">${v}</div><div class="l">${l}</div>`; stats.appendChild(s); });
  wrap.appendChild(stats);

  const sheet=el("div","tsheet"); const b=el("div","sheet-body");
  b.appendChild(el("h3",null,"자주 나온 낱말 20")).style.cssText="margin:0 0 12px;font-size:19px";
  if(!top.length) b.appendChild(el("p","empty","아직 분석할 내용이 없어요."));
  else{
    const max=top[0][1]; const wl=el("div","wordlist");
    top.forEach(([w,c])=>{
      const r=el("div","wordrow");
      r.innerHTML=`<span class="w">${escapeHtml(w)}</span><span class="bar"><i style="width:${Math.round(c/max*100)}%"></i></span><span class="c">${c}</span>`;
      wl.appendChild(r);
    });
    b.appendChild(wl);
  }
  sheet.appendChild(b); wrap.appendChild(sheet);
  return wrap;
}

/* 내보내기 */
function myText(){
  const L=[`${USER||"친구"}의 칭찬일기`,""];
  entryList(DATA.entries).slice().reverse().forEach(e=>{
    const lv=LEVELS.find(l=>l.n===e.level);
    L.push(`[${e.date}] ${e.level}단계 · ${lv.title}`);
    lv.questions.forEach(q=>{ const v=e.answers[q.id]||[]; if(!v.length) return; L.push("  "+q.title); v.forEach(x=>L.push("   - "+x)); });
    L.push("");
  });
  Object.values(DATA.breaks||{}).forEach(b=>{ L.push(`[${b.date}] 쉬어가기 · ${b.title}`); L.push("  "+b.prompt); L.push("   "+b.text); L.push(""); });
  if(DATA.favorites.length){ L.push("좋아하는 순간"); DATA.favorites.forEach(f=>L.push(` - ${f.text} (${f.date})`)); }
  return L.join("\n");
}
function allText(list){
  const L=["칭찬일기 학급 기록",""];
  list.forEach(s=>{
    const p=progressOf(s.entries);
    L.push(`■ ${s.name} — 1단계 ${p[1]}/10, 2단계 ${p[2]}/10, 3단계 ${p[3]}/100`);
    entryList(s.entries).slice().reverse().forEach(e=>{
      const lv=LEVELS.find(l=>l.n===e.level);
      L.push(`  [${e.date}] ${e.level}단계`);
      lv.questions.forEach(q=>{ const v=e.answers[q.id]||[]; if(!v.length) return; L.push("    "+q.title); v.forEach(x=>L.push("     - "+x)); });
    });
    L.push("");
  });
  return L.join("\n");
}
function csvOf(list){
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const rows=[["이름","날짜","단계","질문","내용"].map(q).join(",")];
  list.forEach(s=> entryList(s.entries).slice().reverse().forEach(e=>{
    const lv=LEVELS.find(l=>l.n===e.level);
    lv.questions.forEach(qq=>{ (e.answers[qq.id]||[]).forEach(t=>{
      rows.push([s.name,e.date,e.level+"단계 "+lv.title,qq.title,t].map(q).join(","));
    }); });
  }));
  list.forEach(s=> Object.values(s.breaks||{}).forEach(b=>{
    rows.push([s.name,b.date,"쉬어가기",b.title+" — "+b.prompt,b.text].map(q).join(","));
  }));
  return rows.join("\r\n");
}
function copyText(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.cssText="position:fixed;left:-9999px;top:0";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(ok) toast("복사했어요. 원하는 곳에 붙여넣기 하세요.");
  else if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("복사했어요.")).catch(()=>toast("복사하지 못했어요. 인쇄를 이용해 주세요."));
  else toast("복사하지 못했어요. 인쇄를 이용해 주세요.");
}

const gate=$("#gate"), gateBox=$("#gateBox");
function closeGate(){ gate.classList.add("hidden"); }
function openNameGate(){
  gateBox.innerHTML=`
    <svg width="60" height="60" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 34V18" stroke="var(--leaf)" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 22c-9 0-12-6-12-11 6-1 12 2 12 11z" fill="var(--leaf)"/>
      <path d="M20 26c8 0 11-5 11-10-5-1-11 2-11 10z" fill="var(--sky)"/></svg>
    <h2>이름을 알려 주세요</h2>
    <p>이름을 쓰면 내 일기만 따로 모아 둘 수 있어요. 늘 같은 이름으로 들어와야 지난 일기가 이어져요.</p>
    <input id="gName" placeholder="예) 3학년 2반 김하늘" maxlength="24" autocomplete="off">
    <button class="btn btn-main" id="gGo">시작하기</button>`;
  gate.classList.remove("hidden");
  const i=$("#gName"); i.value=USER||""; setTimeout(()=>i.focus(),60);
  const done=async()=>{
    const v=i.value.trim(); if(!v){ i.focus(); return; }
    USER=v; SKEY=keyOf(v); LS.set("ss.user",USER);
    loadLocal(); DATA.name=USER;
    closeGate(); render();
    flushOutbox();
  };
  $("#gGo").onclick=done;
  i.onkeydown=e=>{ if(e.key==="Enter") done(); };
}
async function openTeacherGate(){
  gateBox.innerHTML=`<h2>선생님 화면</h2>
    <p>Supabase에 만들어 두신 선생님 계정으로 로그인하세요.<br>학생은 로그인할 필요가 없습니다.</p>
    <input id="gEmail" type="email" placeholder="이메일" autocomplete="username" style="margin-bottom:10px">
    <input id="gPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn btn-main" id="gGo">들어가기</button>
    <button class="alt" id="gCancel">그만두기</button>`;
  gate.classList.remove("hidden");
  const em=$("#gEmail"), pw=$("#gPw"), btn=$("#gGo");
  em.value=TEACHER.email||""; setTimeout(()=>(em.value?pw:em).focus(),60);
  const done=async()=>{
    const e=em.value.trim(), p=pw.value;
    if(!e||!p) return;
    btn.textContent="확인 중…"; btn.disabled=true;
    try{
      await teacherLogin(e,p);
      const ok=await fetchAll();
      closeGate();
      MODE="teacher"; current.tview="student"; current.tstudent=null; current.tdate=todayISO();
      startPoll(); renderTabs(); render();
      if(!ok) toast("로그인했지만 기록을 불러오지 못했어요. ‘새로 불러오기’를 눌러 보세요.");
    }catch(err){
      btn.textContent="들어가기"; btn.disabled=false; pw.value="";
      toast("이메일이나 비밀번호가 맞지 않아요.");
    }
  };
  btn.onclick=done;
  $("#gCancel").onclick=closeGate;
  pw.onkeydown=e=>{ if(e.key==="Enter") done(); };
  em.onkeydown=e=>{ if(e.key==="Enter") pw.focus(); };
}

};
